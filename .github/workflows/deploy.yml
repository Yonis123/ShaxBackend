
#
# On every push to main: build the jar, upload it to S3, then tell the
# EC2 instance (through AWS Systems Manager) to install it and restart.

name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  id-token: write           # lets the workflow ask AWS for temporary credentials (OIDC)
  contents: read            # lets it check out the code

concurrency:
  group: deploy-backend     # never run two backend deploys at the same time
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 25 (same Corretto build as the server)
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Build jar (runs tests too)
        run: |
          chmod +x mvnw          # files committed from Windows can lose the "executable" flag
          ./mvnw -B clean package

      - name: Show OIDC claims (debug)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`sub: ${claims.sub}`);
            core.info(`aud: ${claims.aud}`);
            

      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload jar to S3
        id: upload
        run: |
          JAR=$(ls target/*.jar | head -n 1)        # the runnable jar (not *.jar.original)
          KEY="backend/app-${GITHUB_SHA}.jar"       # named after the commit, so every version is kept
          aws s3 cp "$JAR" "s3://${{ vars.ARTIFACT_BUCKET }}/$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Install on EC2 and restart
        env:
          BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          KEY: ${{ steps.upload.outputs.key }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          # The commands the server will run (as root, so no sudo needed).
          # The new jar is downloaded next to the old one, then swapped in with a single
          # rename, so the running app never reads a half-written file.
          PARAMS=$(jq -n --arg src "s3://$BUCKET/$KEY" --arg region "$AWS_REGION" '{commands: [
            "set -e",
            "aws s3 cp \($src) /opt/shax/app.jar.new --region \($region)",
            "chown root:springapp /opt/shax/app.jar.new",
            "chmod 640 /opt/shax/app.jar.new",
            "mv -f /opt/shax/app.jar.new /opt/shax/app.jar",
            "systemctl restart shax",
            "for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/ && echo \"App is up\" && exit 0; sleep 2; done",
            "echo \"App did not start in time\"; journalctl -u shax -n 50 --no-pager; exit 1"
          ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "Sent deploy command: $COMMAND_ID"

          # Wait for the server to finish. The waiter errors if the command fails,
          # so ignore that here and check the real status below.
          sleep 3
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "----- server output -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]   # fail the workflow if the deploy didn't succeed