# --- Database ---
# All injected as environment variables by your host ? never hardcoded.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# --- Connection pool ---
# Cap connections on purpose. Postgres has a total connection ceiling (~100 by default)
# shared across every running instance, so keep this modest. 10 is a fine start.
spring.datasource.hikari.maximum-pool-size=10

# --- CORS ---
# Your deployed frontend's URL, injected as an env var (e.g. https://yourgame.vercel.app).
app.cors.allowed-origins=${FRONTEND_URL}